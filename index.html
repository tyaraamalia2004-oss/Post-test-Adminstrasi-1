<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST TEST ADMINISTRASI - PT Tuku Emas Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <div id="app" class="max-w-3xl mx-auto p-4 sm:p-6">

        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 text-center border border-slate-200">
            <img src="TE-4.png" alt="Logo PT Tuku Emas Indonesia" class="h-16 mx-auto mb-3 object-contain" onerror="this.style.display='none'">
            <h1 class="text-xl sm:text-2xl font-bold tracking-wide text-amber-600 uppercase">PT Tuku Emas Indonesia</h1>
            <h2 class="text-lg font-semibold text-slate-700 mt-1">POST TEST ADMINISTRASI TINGKAT LANJUT</h2>
            <p class="text-xs text-slate-500 mt-1">Evaluasi Kompleksitas Operasional Outlet, Kasus Khusus Accurate, & Manajemen Logistik</p>
        </div>

        <!-- 1. HALAMAN LOGIN / IDENTITAS PESERTA -->
        <div id="login-screen" class="bg-white rounded-2xl shadow-sm p-6 sm:p-8 border border-slate-200 space-y-4">
            <h3 class="text-lg font-semibold text-slate-800 mb-2 border-b pb-2">Identitas Peserta Ujian</h3>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" id="input-nama" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="Masukkan nama lengkap Anda">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Outlet / Cabang</label>
                <input type="text" id="input-outlet" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="Contoh: Cabang Kiaracondong / Cikarang">
            </div>
            <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs sm:text-sm space-y-1">
                <p class="font-semibold">
